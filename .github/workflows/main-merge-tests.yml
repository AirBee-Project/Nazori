name: main merge tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/**"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: fmt

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "features: default (parallel active)"
            default_features: true
            wasm_build: false
          - name: "features: none (parallel inactive)"
            default_features: false
            wasm_build: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.default_features }}" = "true" ]; then
            cargo test \
              --locked \
              --lib \
              --bins \
              --tests
          else
            cargo test \
              --locked \
              --lib \
              --bins \
              --tests \
              --no-default-features
          fi

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.default_features }}" = "true" ]; then
            cargo clippy \
              --locked \
              --lib \
              --bins \
              --tests \
              -- -D warnings
          else
            cargo clippy \
              --locked \
              --lib \
              --bins \
              --tests \
              --no-default-features \
              -- -D warnings
          fi

      - name: Verify WebAssembly compilation (parallel inactive)
        if: matrix.wasm_build == true
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target wasm32-unknown-unknown --no-default-features --lib
