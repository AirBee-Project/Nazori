[package]
name = "nazori"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "parallel"]
parallel = ["dep:rayon"]
std = ["kasane-logic/std"]

[dependencies]
quick-xml = "0.40.1"
ordered-float = { version = "5.1.0", default-features = false, features = ["serde"] }
kasane-logic = { git = "https://github.com/AirBee-Project/Kasane-Logic.git", branch = "main",default-features = false }
rayon = { version = "1.10.0", optional = true }
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
insta = { version = "1.47.2", features = ["glob"] }

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["precommit-hook","run-cargo-clippy","run-cargo-fmt"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
