[package]
name = "nazori"
version = "0.1.0"
edition = "2024"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
quick-xml = "0.40.1"
ordered-float = { version = "5.1.0", default-features = false }
kasane-logic = { git = "https://github.com/AirBee-Project/Kasane-Logic.git", branch = "main",default-features = false }
rayon = { version = "1.10.0", optional = true }

[dev-dependencies]
insta = { version = "1.47.2", features = ["glob"] }

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["precommit-hook","run-cargo-clippy","run-cargo-fmt"]


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"